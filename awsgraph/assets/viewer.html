<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__AWSGRAPH_TITLE__ — AWSGraph</title>
<style>
  :root {
    color-scheme: light dark;
    --line: #8886;
    --dim: #7a7a7a;
    --panel: #8881;
  }
  * { box-sizing: border-box; }
  body {
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    margin: 0; height: 100vh; display: flex; flex-direction: column;
  }
  header { padding: .8rem 1rem .4rem; }
  h1 { font-size: 1.15rem; margin: 0; }
  .meta { color: var(--dim); font-size: 12px; }
  .total { font-size: 1.5rem; font-weight: 600; }
  .toolbar {
    display: flex; gap: .5rem; flex-wrap: wrap; align-items: center;
    padding: .5rem 1rem; border-bottom: 1px solid var(--line);
  }
  input, select, button {
    font: inherit; padding: .25rem .5rem; border: 1px solid var(--line);
    border-radius: 4px; background: transparent; color: inherit;
  }
  button { cursor: pointer; }
  main { flex: 1; display: flex; min-height: 0; }
  #canvas { flex: 1; touch-action: none; cursor: grab; }
  #canvas.dragging { cursor: grabbing; }
  aside {
    width: 21rem; overflow-y: auto; padding: 1rem;
    border-left: 1px solid var(--line); background: var(--panel);
  }
  aside h2 { font-size: 1rem; margin: 0 0 .25rem; }
  aside dl { display: grid; grid-template-columns: auto 1fr; gap: .1rem .6rem; margin: .4rem 0; }
  aside dt { color: var(--dim); }
  aside dd { margin: 0; overflow-wrap: anywhere; }
  aside section { margin-top: .9rem; }
  aside ul { margin: .3rem 0; padding-left: 1.1rem; }
  .node rect { fill: var(--panel); stroke: var(--line); stroke-width: 1.5; rx: 6; }
  .node.selected rect { stroke: #4a90d9; stroke-width: 2.5; }
  .node.unpriced rect { stroke-dasharray: 4 3; }
  .node { cursor: pointer; }
  .node .label { font-weight: 600; }
  .node .sub, .edge-label { fill: var(--dim); font-size: 11px; }
  .edge { stroke: var(--line); stroke-width: 1.5; fill: none; }
  .empty { padding: 2rem; color: var(--dim); }
</style>
</head>
<body>
<header>
  <h1 id="arch-name"></h1>
  <p class="meta" id="arch-meta"></p>
  <p class="total" id="arch-total"></p>
</header>

<div class="toolbar">
  <input id="search" type="search" placeholder="Search resources" aria-label="Search resources">
  <select id="filter-type" aria-label="Filter by resource type"></select>
  <select id="filter-service" aria-label="Filter by service"></select>
  <select id="sort" aria-label="Sort">
    <option value="cost">Sort: cost</option>
    <option value="name">Sort: name</option>
    <option value="type">Sort: type</option>
  </select>
  <button id="fit" type="button">Fit</button>
  <span class="meta" id="counts"></span>
</div>

<main>
  <svg id="canvas" role="img" aria-label="Architecture graph"></svg>
  <aside id="details"><p class="empty">Select a resource to see its configuration and cost.</p></aside>
</main>

<noscript><p class="empty">This viewer needs JavaScript. The same data is in graph.json and AWS_REPORT.md.</p></noscript>

<script type="application/json" id="awsgraph-data">__AWSGRAPH_DATA__</script>
<script>
(() => {
  "use strict";
  const SVG_NS = "http://www.w3.org/2000/svg";
  const data = JSON.parse(document.getElementById("awsgraph-data").textContent);
  const meta = data.graph || {};
  const estimate = meta.estimate || {};
  const currency = meta.currency || "USD";
  const nodes = data.nodes || [];
  const edges = data.edges || [];
  const byId = new Map(nodes.map(n => [n.id, n]));

  const NODE_W = 170, NODE_H = 46, GAP_X = 40, GAP_Y = 90;
  const canvas = document.getElementById("canvas");
  const details = document.getElementById("details");
  let selected = null;

  const money = v => currency === "USD" ? "$" + v : v + " " + currency;
  const text = (parent, value) => parent.appendChild(document.createTextNode(value));

  function el(tag, attrs, parent) {
    const node = document.createElementNS(SVG_NS, tag);
    for (const [k, v] of Object.entries(attrs || {})) node.setAttribute(k, v);
    if (parent) parent.appendChild(node);
    return node;
  }

  // --- layout ---------------------------------------------------------------
  // Longest-path ranking, capped at one pass per node so a cycle cannot spin.
  // ponytail: O(V*E); swap for a real layered layout if graphs outgrow a screen.
  function layout() {
    const rank = new Map(nodes.map(n => [n.id, 0]));
    for (let i = 0; i < nodes.length; i++) {
      let changed = false;
      for (const e of edges) {
        if (!rank.has(e.source) || !rank.has(e.target)) continue;
        const next = rank.get(e.source) + 1;
        if (next > rank.get(e.target)) { rank.set(e.target, next); changed = true; }
      }
      if (!changed) break;
    }
    const rows = new Map();
    for (const n of nodes) {
      const r = rank.get(n.id) || 0;
      if (!rows.has(r)) rows.set(r, []);
      rows.get(r).push(n);
    }
    const placed = new Map();
    for (const [r, row] of rows) {
      row.forEach((n, i) => {
        // A position from the design file wins over the computed one.
        const p = n.position;
        placed.set(n.id, p ? { x: p.x, y: p.y } : { x: i * (NODE_W + GAP_X), y: r * GAP_Y });
      });
    }
    return placed;
  }
  const positions = layout();

  // --- filters --------------------------------------------------------------
  const search = document.getElementById("search");
  const filterType = document.getElementById("filter-type");
  const filterService = document.getElementById("filter-service");
  const sortBy = document.getElementById("sort");

  function fillSelect(select, label, values) {
    const all = document.createElement("option");
    all.value = "";
    text(all, label);
    select.appendChild(all);
    for (const value of [...new Set(values)].sort()) {
      const option = document.createElement("option");
      option.value = value;
      text(option, value);
      select.appendChild(option);
    }
  }
  fillSelect(filterType, "All types", nodes.map(n => n.resource_type));
  fillSelect(filterService, "All services", nodes.map(n => n.service));

  function visibleNodes() {
    const term = search.value.trim().toLowerCase();
    return nodes.filter(n => {
      if (filterType.value && n.resource_type !== filterType.value) return false;
      if (filterService.value && n.service !== filterService.value) return false;
      if (!term) return true;
      return (n.label + " " + n.resource_type + " " + n.service).toLowerCase().includes(term);
    });
  }

  function sorted(list) {
    const copy = [...list];
    if (sortBy.value === "cost") {
      copy.sort((a, b) => Number(b.monthly_cost || 0) - Number(a.monthly_cost || 0));
    } else if (sortBy.value === "type") {
      copy.sort((a, b) => a.resource_type.localeCompare(b.resource_type) || a.label.localeCompare(b.label));
    } else {
      copy.sort((a, b) => a.label.localeCompare(b.label));
    }
    return copy;
  }

  // --- details panel --------------------------------------------------------
  function section(title, rows) {
    if (!rows.length) return null;
    const box = document.createElement("section");
    const heading = document.createElement("h3");
    heading.style.font = "inherit";
    heading.style.color = "var(--dim)";
    text(heading, title);
    box.appendChild(heading);
    const list = document.createElement("ul");
    for (const row of rows) {
      const item = document.createElement("li");
      text(item, row);
      list.appendChild(item);
    }
    box.appendChild(list);
    return box;
  }

  function showDetails(node) {
    details.replaceChildren();
    const heading = document.createElement("h2");
    text(heading, node.label);
    details.appendChild(heading);

    const dl = document.createElement("dl");
    const pairs = [
      ["Type", node.resource_type + " (" + node.service + ")"],
      ["Region", node.region || ""],
      ["Monthly", money(node.monthly_cost || "0") + " (" + (node.cost_status || "unknown") + ")"],
      ["Id", node.id],
    ];
    for (const [key, value] of pairs) {
      const dt = document.createElement("dt");
      text(dt, key);
      const dd = document.createElement("dd");
      text(dd, value);
      dl.append(dt, dd);
    }
    details.appendChild(dl);

    const entries = obj => Object.entries(obj || {}).map(([k, v]) => k + ": " + v);
    const links = [];
    for (const e of edges) {
      if (e.target === node.id) links.push("← " + (byId.get(e.source) || {}).label + " [" + e.relation + "]");
      if (e.source === node.id) links.push("→ " + (byId.get(e.target) || {}).label + " [" + e.relation + "]");
    }
    const blocks = [
      section("Configuration", entries(node.configuration)),
      section("Usage", entries(node.usage)),
      section("Cost breakdown", (node.cost_breakdown || []).map(i => i.name + ": " + money(i.amount))),
      section("Connections", links),
      section("Assumptions", node.cost_assumptions || []),
      section("Missing prices", node.cost_missing || []),
    ];
    for (const block of blocks) if (block) details.appendChild(block);
  }

  // --- rendering ------------------------------------------------------------
  let view = null;

  function render(refit) {
    canvas.replaceChildren();
    const shown = sorted(visibleNodes());
    const shownIds = new Set(shown.map(n => n.id));
    document.getElementById("counts").textContent =
      shown.length + " / " + nodes.length + " resources";

    const edgeLayer = el("g", {}, canvas);
    const nodeLayer = el("g", {}, canvas);

    for (const e of edges) {
      if (!shownIds.has(e.source) || !shownIds.has(e.target)) continue;
      const a = positions.get(e.source), b = positions.get(e.target);
      if (!a || !b) continue;
      const x1 = a.x + NODE_W / 2, y1 = a.y + NODE_H;
      const x2 = b.x + NODE_W / 2, y2 = b.y;
      el("path", { class: "edge", d: `M${x1} ${y1} C ${x1} ${y1 + 30}, ${x2} ${y2 - 30}, ${x2} ${y2}` }, edgeLayer);
      const label = el("text", { class: "edge-label", x: (x1 + x2) / 2, y: (y1 + y2) / 2, "text-anchor": "middle" }, edgeLayer);
      text(label, e.relation);
    }

    for (const n of shown) {
      const p = positions.get(n.id);
      if (!p) continue;
      const group = el("g", {
        class: "node" + (n.cost_status === "priced" ? "" : " unpriced") + (selected === n.id ? " selected" : ""),
        transform: `translate(${p.x} ${p.y})`, tabindex: "0", role: "button",
      }, nodeLayer);
      el("rect", { width: NODE_W, height: NODE_H }, group);
      const name = el("text", { class: "label", x: 10, y: 19 }, group);
      text(name, n.label);
      const sub = el("text", { class: "sub", x: 10, y: 35 }, group);
      text(sub, n.resource_type + " · " + money(n.monthly_cost || "0"));
      const pick = () => { selected = n.id; showDetails(n); render(false); };
      group.addEventListener("click", pick);
      group.addEventListener("keydown", ev => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); pick(); } });
    }

    if (refit || !view) fit(shown);
    applyView();
  }

  function fit(shown) {
    if (!shown.length) { view = { x: 0, y: 0, w: 800, h: 600 }; return; }
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    for (const n of shown) {
      const p = positions.get(n.id);
      if (!p) continue;
      minX = Math.min(minX, p.x); minY = Math.min(minY, p.y);
      maxX = Math.max(maxX, p.x + NODE_W); maxY = Math.max(maxY, p.y + NODE_H);
    }
    const pad = 40;
    view = { x: minX - pad, y: minY - pad, w: (maxX - minX) + pad * 2, h: (maxY - minY) + pad * 2 };
  }

  const applyView = () => canvas.setAttribute("viewBox", `${view.x} ${view.y} ${view.w} ${view.h}`);

  canvas.addEventListener("wheel", ev => {
    ev.preventDefault();
    const scale = ev.deltaY > 0 ? 1.1 : 0.9;
    view.w *= scale; view.h *= scale;
    applyView();
  }, { passive: false });

  let dragging = null;
  canvas.addEventListener("pointerdown", ev => {
    dragging = { x: ev.clientX, y: ev.clientY };
    canvas.classList.add("dragging");
    canvas.setPointerCapture(ev.pointerId);
  });
  canvas.addEventListener("pointermove", ev => {
    if (!dragging) return;
    const rect = canvas.getBoundingClientRect();
    view.x -= (ev.clientX - dragging.x) * view.w / rect.width;
    view.y -= (ev.clientY - dragging.y) * view.h / rect.height;
    dragging = { x: ev.clientX, y: ev.clientY };
    applyView();
  });
  const endDrag = () => { dragging = null; canvas.classList.remove("dragging"); };
  canvas.addEventListener("pointerup", endDrag);
  canvas.addEventListener("pointercancel", endDrag);

  // --- header + wiring ------------------------------------------------------
  document.getElementById("arch-name").textContent = meta.architecture_name || "AWSGraph";
  document.getElementById("arch-meta").textContent =
    [meta.region, "catalog " + (meta.catalog_id || "unknown"), "AWSGraph " + (meta.product_version || "")]
      .filter(Boolean).join(" · ");
  document.getElementById("arch-total").textContent =
    money(estimate.monthly_cost || "0") + " / month" +
    (estimate.status && estimate.status !== "priced" ? " (" + estimate.status + ")" : "");

  for (const control of [search, filterType, filterService, sortBy]) {
    control.addEventListener("input", () => render(false));
  }
  document.getElementById("fit").addEventListener("click", () => render(true));
  render(true);
})();
</script>
</body>
</html>
